name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────
  # CI — Build & Type Check
  # ─────────────────────────
  ci:
    name: 🔍 Build & Type Check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:root@localhost:5432/rbac_db"
      JWT_SECRET: "ci-dummy-secret-key"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "ci-dummy-refresh-secret"
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      PORT: "3030"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # - name: Generate Prisma Client
      #   run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─────────────────────────
  # CD — Deploy to VPS
  # ─────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/rbac-project

            # Latest code pull
            git pull origin main

            # .env update
            cat > .env << EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN }}
            PORT=3030
            NODE_ENV=production
            EOF

            # Install & Build
            npm install
            npm run build

            # Prisma generate & migrate
            npx prisma generate
            npx prisma migrate deploy

            # PM2 restart
            pm2 restart rbac-app || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "✅ Deployment complete!"
