ci:
  name: 🔍 Build & Type Check
  runs-on: ubuntu-latest

  env:
    DATABASE_URL: "postgresql://postgres:root@localhost:5432/rbac_db"
    JWT_SECRET: "ci-dummy-secret-key"
    JWT_EXPIRES_IN: "15m"
    REFRESH_TOKEN_SECRET: "ci-dummy-refresh-secret"
    REFRESH_TOKEN_EXPIRES_IN: "7d"
    PORT: "3030"

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Install dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build
